site_name: AWS SAA-C03 Study Guide
site_description: Notes, handnotes and practice questions for the AWS Certified Solutions Architect - Associate (SAA-C03) exam
site_url: https://dlamott.github.io/aws_saa_c03_study_guide/
repo_url: https://github.com/DLaMott/aws_saa_c03_study_guide
docs_dir: content

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - glightbox   # click-to-zoom on the many architecture diagrams

hooks:
  - hooks/details_markdown.py

exclude_docs: |
  mcq/question_structure_prompt.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

